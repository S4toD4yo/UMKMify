<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMKMify | Register</title>
    <link rel="stylesheet" href="../../assets/styles.css">
    <link rel="stylesheet" href="../../assets/authFeedback.css">
    <script src="../../App.js" defer></script>
    <link rel="icon" type="image/png" href="../../assets/images/UMKMify Title Logo.png">
</head>
    <body class="registerAuthBody">
        <div class="registerBranding">

            <img
                src="../../assets/images/Logo - Orange.svg"
                alt="UMKMify"
                class="registerLogo"
            >

            <h3 class="registerBrandingTitle">
                Breaking Digital Boundaries, Elevating Local Business.
            </h3>

        </div>

        <!-- Register Container -->
        <div class="registerContainer">
            <h1 class="registerTitle">
                Create Your Account
            </h1>

            <h3 class="registerSubtitle">
                Let’s get started with UMKMify
            </h3>

            <form id="registerForm" novalidate>

                <div class="registerFormGrid">

                    <!-- Username -->
                    <div class="registerFormField">
                        <h3 class="registerFormLabel">
                            Username
                        </h3>

                        <input
                            type="text"
                            id="registerUsername"
                            class="registerFormInput"
                            placeholder="Create your username"
                            tabindex="1"
                            required
                        >
                        <p class="authFieldError" id="registerUsernameError"></p>

                    </div>

                    <!-- Password -->
                    <div class="registerFormField">
                        <h3 class="registerFormLabel">
                            Password
                        </h3>

                        <div class="registerPasswordWrapper">
                            <input
                                type="password"
                                id="registerPassword"
                                class="registerFormInput"
                                placeholder="Enter your password"
                                tabindex="3"
                                required
                            >

                            <button
                                type="button"
                                id="registerPasswordToggle"
                                class="registerPasswordToggle"
                                aria-label="Show password"
                            >
                                <img
                                    id="registerPasswordIcon"
                                    src="../../assets/icons/Eye.svg"
                                    alt=""
                                >
                            </button>
                        </div>

                        <p class="authFieldError" id="registerPasswordError"></p>
                    </div>

                    <!-- Email -->
                    <div class="registerFormField">
                        <h3 class="registerFormLabel">
                            Email
                        </h3>

                        <input
                            type="email"
                            id="registerEmail"
                            class="registerFormInput"
                            placeholder="Enter your email address"
                            tabindex="2"
                            required
                        >
                        <p class="authFieldError" id="registerEmailError"></p>

                    </div>

                    <!-- Re-enter Password -->
                    <div class="registerFormField">
                        <h3 class="registerFormLabel">
                            Re-enter Password
                        </h3>

                        <div class="registerPasswordWrapper">
                            <input
                                type="password"
                                id="registerConfirmPassword"
                                class="registerFormInput"
                                placeholder="Re-enter your password"
                                tabindex="4"
                                required
                            >

                            <button
                                type="button"
                                id="registerConfirmPasswordToggle"
                                class="registerPasswordToggle"
                                aria-label="Show password"
                            >
                                <img
                                    id="registerConfirmPasswordIcon"
                                    src="../../assets/icons/Eye.svg"
                                    alt=""
                                >
                            </button>
                        </div>

                        <p class="authFieldError" id="registerConfirmPasswordError"></p>
                    </div>

                </div>

                <p class="authFormError" id="registerFormError"></p>

                <button
                    type="submit"
                    id="registerSubmit"
                    class="registerSignUpButton"
                    tabindex="5"
                >
                    Sign Up
                </button>

            </form>
            <p class="registerSignInText">
                Already have an account?
                <a
                    href="./login.html"
                    class="registerSignInLink"
                >
                    Sign In
                </a>
                now
            </p>
        </div>

        <!-- Auth Footer -->
        <footer class="authFooter" style="margin-top: 64px;">
            <p class="authFooterText">
                &copy; 2026 UMKMify, All rights reserved.
            </p>
        </footer>
    </body>
</html>
