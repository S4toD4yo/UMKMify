# Railway build for the Laravel API. The PHP provider already runs
# `composer install`; these commands add the production caches on top.
[phases.build]
dependsOn = ["install"]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
